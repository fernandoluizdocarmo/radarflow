<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Premium -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1118"/>
      <stop offset="50%" stop-color="#111a24"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>

    <!-- Gradiente do Arco de Velocidade / Radar -->
    <linearGradient id="speedArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a6df4"/>
      <stop offset="50%" stop-color="#00d6fe"/>
      <stop offset="85%" stop-color="#ffc20e"/>
      <stop offset="100%" stop-color="#ff4757"/>
    </linearGradient>

    <!-- Gradiente do Feixe de Radar -->
    <linearGradient id="radarBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d6fe" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a6df4" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Gradiente do Ponteiro Central -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>

    <!-- Filtro de Brilho / Glow Neom -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Estilo App Store / Google Play -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#253342" stroke-width="3" opacity="0.6"/>

  <!-- Feixe de Varredura do Radar -->
  <path d="M 256 256 L 390 122 A 190 190 0 0 0 256 66 Z" fill="url(#radarBeam)" />

  <!-- Anéis Concêntricos do Radar -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1d2a38" stroke-width="4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1d2a38" stroke-width="3" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#1d2a38" stroke-width="2"/>

  <!-- Eixo em Cruz do Radar -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#182330" stroke-width="2"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#182330" stroke-width="2"/>

  <!-- Arco Principal de Velocímetro & Média -->
  <!-- Circunferência 2 * PI * 160 = ~1005. Arco de 270 graus (~754) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#192430" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="754 1005" stroke-dashoffset="-125" transform="rotate(135 256 256)"/>
  
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#speedArc)" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="540 1005" stroke-dashoffset="-125" transform="rotate(135 256 256)" filter="url(#glow)"/>

  <!-- Pontos de Medição de Média (Ponto A e Ponto B) -->
  <!-- Ponto A (Início - Ciano) -->
  <circle cx="143" cy="369" r="14" fill="#00d6fe" filter="url(#glow)"/>
  <circle cx="143" cy="369" r="6" fill="#ffffff"/>

  <!-- Ponto B (Fim / Alvo - Ouro) -->
  <circle cx="369" cy="369" r="14" fill="#ffc20e" filter="url(#glow)"/>
  <circle cx="369" cy="369" r="6" fill="#ffffff"/>

  <!-- Ponteiro Central Dinâmico / Agulha de Velocidade -->
  <polygon points="256,105 264,256 248,256" fill="url(#needleGrad)" filter="url(#glow)" transform="rotate(28 256 256)"/>

  <!-- Centro do Velocímetro -->
  <circle cx="256" cy="256" r="32" fill="#141c24" stroke="#2c3c4f" stroke-width="5" filter="url(#softShadow)"/>
  <circle cx="256" cy="256" r="14" fill="#00d6fe"/>

  <!-- Onda de Sinal de GPS / Radar Topo -->
  <path d="M 226 150 A 42 42 0 0 1 286 150" fill="none" stroke="#00d6fe" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 210 134 A 64 64 0 0 1 302 134" fill="none" stroke="#00d6fe" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Tipografia de Marca na Base -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle">RADAR<tspan fill="#00d6fe">FLOW</tspan></text>
</svg>