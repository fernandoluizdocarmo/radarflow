<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo Obsidian Dark com reflexo de profundidade -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f16"/>
      <stop offset="40%" stop-color="#0e1520"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>

    <!-- Brilho no topo do vidro (Glassmorphism Bevel) -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#385473" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#192838" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d151f" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Gradiente do Feixe de Luz / Fluxo de Velocidade (Electric Cyan to Neon Red) -->
    <linearGradient id="neonFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#4facfe"/>
      <stop offset="78%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>

    <!-- Feixe Central do Radar -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2a6df4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente da Agulha Hi-Tech -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="50%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Filtro Neon Glow Intenso -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="22" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sombra 3D Suave -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Corpo do Ícone - Squircle Apple/Android Style -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="url(#glassBorder)" stroke-width="3"/>

  <!-- Brilho Ambiente Central de Fundo -->
  <circle cx="256" cy="256" r="170" fill="url(#radarSweep)"/>

  <!-- Grade HUD Circular de Radar -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#162332" stroke-width="2.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1a2a3c" stroke-width="2" stroke-dasharray="6 8" opacity="0.8"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#162332" stroke-width="2" opacity="0.5"/>
  <circle cx="256" cy="256" r="50" fill="none" stroke="#1a2a3c" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Linhas de Vetor e Escalas do Radar -->
  <line x1="256" y1="65" x2="256" y2="447" stroke="#14202e" stroke-width="2" stroke-dasharray="5 5" opacity="0.5"/>
  <line x1="65" y1="256" x2="447" y2="256" stroke="#14202e" stroke-width="2" stroke-dasharray="5 5" opacity="0.5"/>

  <!-- Feixe de Varredura Angular (Sweep Radar Cone) -->
  <path d="M 256 256 L 392 120 A 192 192 0 0 0 256 64 Z" fill="url(#neonFlow)" opacity="0.16"/>

  <!-- Trilho Guia Traseiro Escuro -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#15212e" stroke-width="24" stroke-linecap="round"
          stroke-dasharray="760 1020" stroke-dashoffset="-130" transform="rotate(135 256 256)"/>

  <!-- ARCO PRINCIPAL VELOCIDADE MÉDIA (Super Brilho Neon) -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#neonFlow)" stroke-width="24" stroke-linecap="round"
          stroke-dasharray="540 1020" stroke-dashoffset="-130" transform="rotate(135 256 256)" filter="url(#superGlow)"/>

  <!-- Marcadores dos Pórticos de Radar (Ponto A e Ponto B) -->
  <!-- Linha conectora de trecho de média -->
  <path d="M 142 370 Q 256 320 370 370" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" opacity="0.4" stroke-dasharray="6 6"/>

  <!-- Sensor Ponto A (Entrada do Trecho - Ciano Neon) -->
  <g filter="url(#superGlow)">
    <circle cx="142" cy="370" r="18" fill="#091420" stroke="#00f2fe" stroke-width="5"/>
    <circle cx="142" cy="370" r="8" fill="#00f2fe"/>
    <circle cx="142" cy="370" r="3" fill="#ffffff"/>
  </g>

  <!-- Sensor Ponto B (Fim do Trecho - Âmbar/Ouro Neon) -->
  <g filter="url(#superGlow)">
    <circle cx="370" cy="370" r="18" fill="#1c1605" stroke="#ffb703" stroke-width="5"/>
    <circle cx="370" cy="370" r="8" fill="#ffb703"/>
    <circle cx="370" cy="370" r="3" fill="#ffffff"/>
  </g>

  <!-- Agulha de Velocímetro Supersônica Central -->
  <polygon points="256,92 264,256 248,256" fill="url(#needleGrad)" filter="url(#superGlow)" transform="rotate(32 256 256)"/>

  <!-- Centro Blindado estilo Roda Automotiva / Hub Turbine -->
  <circle cx="256" cy="256" r="36" fill="#0d141e" stroke="#25384d" stroke-width="6" filter="url(#shadow3D)"/>
  <circle cx="256" cy="256" r="18" fill="#00f2fe" filter="url(#superGlow)"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>

  <!-- Pulso de Satélite / Radar GPS no Topo -->
  <path d="M 220 152 A 48 48 0 0 1 292 152" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" opacity="0.85" filter="url(#superGlow)"/>
  <path d="M 200 132 A 75 75 0 0 1 312 132" fill="none" stroke="#4facfe" stroke-width="4" stroke-linecap="round" opacity="0.5" filter="url(#superGlow)"/>
</svg>